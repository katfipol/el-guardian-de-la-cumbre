<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Guardián de la Cumbre — Modo Pantalla Completa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0c1a2e;
      --bg-surface: #152946;
      --accent-cyan: #38bdf8;
      --accent-ice: #7dd3fc;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --line-subtle: rgba(125, 211, 252, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bg-base);
      border-bottom: 1px solid var(--line-subtle);
      padding: 0.65rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand {
      font-family: 'Silkscreen', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-ice);
      text-decoration: none;
    }

    .controls-inline {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls-inline kbd {
      font-family: 'Silkscreen', monospace;
      font-size: 0.72rem;
      color: var(--accent-ice);
      background: var(--bg-surface);
      border: 1px solid var(--accent-cyan);
      padding: 0.12rem 0.4rem;
      margin: 0 0.15rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      font-family: 'Silkscreen', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.55rem 1rem;
      transition: background-color 180ms ease, transform 150ms ease;
    }

    .btn-outline {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 2px solid var(--accent-cyan);
    }

    .btn-outline:hover {
      background: #1c365c;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #071324;
      border: 2px solid #bae6fd;
    }

    .btn-primary:hover {
      background: var(--accent-ice);
    }

    .stage {
      flex: 1;
      width: 100%;
      background: #000;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <a href="index.html" class="brand">EL GUARDIÁN DE LA CUMBRE</a>
      <div class="controls-inline">
        Mover: <kbd>A</kbd><kbd>D</kbd> • Saltar: <kbd>ESPACIO</kbd> • Disparar: <kbd>CLIC</kbd> / <kbd>J</kbd> • Pausa: <kbd>ESC</kbd>
      </div>
    </div>

    <div class="actions">
      <a href="index.html#trailer" class="btn btn-outline">Ver Tráiler</a>
      <a href="index.html" class="btn btn-primary">Volver al Portal</a>
    </div>
  </header>

  <div class="stage">
    <iframe src="juego/index.html" title="El Guardián de la Cumbre — Pantalla Completa" allowfullscreen></iframe>
  </div>

</body>
</html>
